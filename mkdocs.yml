site_name: EuroFlood
site_description: Query Europe's satellite flood-depth maps as GeoDataFrames, in a few lines.
site_author: Jürgen Hackl
site_url: https://cisgroup.github.io/euroflood/
repo_url: https://github.com/cisgroup/euroflood
repo_name: cisgroup/euroflood
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.png
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.action.view
  palette:
    # Follow the OS preference, with a manual toggle through light -> dark -> auto.
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom # EuroFlood azure (see docs/stylesheets/extra.css)
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference

extra_css:
  - stylesheets/extra.css

# Injects the installed euroflood version into the footer (see scripts/mkdocs_hooks.py).
hooks:
  - scripts/mkdocs_hooks.py

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cisgroup/euroflood
      name: EuroFlood on GitHub

# Keep the tutorials' jupytext .py sources and their run artifacts (zutphen.*, out/…)
# out of the built site; the docs/tutorials symlink to examples/ would otherwise
# serve them as raw static files.
exclude_docs: |
  *.py
  out/
  outputs/
  *.csv
  *.geojson
  *.parquet
  *.tif
  .virtual_documents/
  .ipynb_checkpoints/

plugins:
  - search
  # Render the tutorial notebooks (examples/, via the docs/tutorials symlink) with their
  # committed outputs. execute:false keeps the docs build fast + offline; only .ipynb become
  # pages (a "download notebook" link is added by include_source).
  - mkdocs-jupyter:
      execute: false
      include_source: true
      include: ["*.ipynb"]
      theme: light
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            line_length: 60
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            summary: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Tutorials:
      - tutorials/README.md
      - Quickstart: tutorials/01_quickstart.ipynb
      - Discover & filter: tutorials/02_discover_and_filter.ipynb
      - Visualize: tutorials/03_visualize.ipynb
      - Download & measure: tutorials/04_download_and_measure.ipynb
      - Hazard: tutorials/05_hazard.ipynb
      - Quantitative analysis: tutorials/06_analysis.ipynb
      - CLI & configuration: tutorials/07_cli_and_config.ipynb
  - Case studies:
      - case-studies/README.md
      - Storm Boris (transboundary): case-studies/01_boris_transboundary.ipynb
      - A decade at Zutphen: case-studies/02_zutphen_decade.ipynb
      - Shannon callows (exposure): case-studies/03_shannon_callows.ipynb
      - Valencia DANA (detectability): case-studies/04_valencia_dana.ipynb
      - Baltic surge (coastal): case-studies/05_baltic_surge.ipynb
      - Continental recurrence: case-studies/06_continental_recurrence.ipynb
  - Concepts: concepts.md
  - API reference:
      - reference/index.md
      - Python API: reference/api.md
      - FloodFrame: reference/floodframe.md
      - Configuration: reference/configuration.md
      - Visualization: reference/visualization.md
      - CLI & output: reference/cli.md
      - Internals:
          - Pipelines: reference/pipelines.md
          - Services: reference/services.md
          - Core: reference/core.md
      - Building the index (producers): hpc-runbook.md
  - Citing EuroFlood: citation.md
